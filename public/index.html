function Kitchen({ user, profile, plan, shopping, pantryDoc, recipes, section, setSection }) {
  const pantry = pantryDoc?.ingredients || [];
  const items = (shopping?.items || []).map((i) => (typeof i === "string" ? { name: i, checked: false } : i));
  const [busy, setBusy] = useState(null); // 'shop' | 'pantry' | 'plan'
  const [err, setErr] = useState(null);
  const [newIng, setNewIng] = useState("");
  const [newItem, setNewItem] = useState("");
  const [openId, setOpenId] = useState(null);
  const validPlan = plan && Array.isArray(plan.meals) && plan.meals.length;
  const byKind = (k) => recipes.filter((r) => r.kind === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const favorites = recipes.filter((r) => r.favorite);
  const open = openId ? recipes.find((r) => r.id === openId) : null;

  const saveShop = (list) => setDoc(doc(db, "shoppingLists", user.uid), clean({ uid: user.uid, items: list, updatedAt: new Date().toISOString() }));
  const savePantry = (ingredients) => setDoc(doc(db, "pantry", user.uid), clean({ uid: user.uid, ingredients, updatedAt: new Date().toISOString() }), { merge: true });

  // --- compras ---
  const genShopping = async () => {
    if (!validPlan) { setErr('Crie um plano alimentar primeiro na aba "Plano".'); return; }
    if (items.length && !(await confirmAsk({ title: "Gerar nova lista?", text: "A lista atual será substituída por uma nova lista da semana, baseada no seu plano.", ok: "Gerar" }))) return;
    setBusy("shop"); setErr(null);
    try {
      const r = await ai("shoppingList", { plan: { meals: plan.meals.map((m) => ({ name: m.name, options: planOptions(m, plan).map((o) => ({ text: o.text })) })) }, profile: profileForAI(profile) });
      const list = (Array.isArray(r?.items) ? r.items : []).slice(0, 70).map((i) => ({ name: str(typeof i === "string" ? i : i?.name, 80), category: str(i?.category || "Outros", 30), checked: false })).filter((i) => i.name);
      if (!list.length) throw new Error("A IA não retornou itens. Tente novamente.");
      await saveShop(list); toast("Lista de compras da semana pronta!");
    } catch (e) { setErr(e.message); } finally { setBusy(null); }
  };
  const toggleItem = (idx) => saveShop(items.map((it, i) => (i === idx ? { ...it, checked: !it.checked } : it))).catch(() => toast("Erro ao salvar.", "err"));
  const removeItem = (idx) => saveShop(items.filter((_, i) => i !== idx)).catch(() => toast("Erro ao salvar.", "err"));
  const addItem = (e) => { e.preventDefault(); const nm = newItem.trim(); if (!nm) return; setNewItem(""); saveShop([...items, { name: str(nm, 80), category: "Outros", checked: false }]).catch(() => toast("Erro ao salvar.", "err")); };
  const moveCheckedToPantry = async () => {
    const bought = items.filter((i) => i.checked);
    if (!bought.length) return;
    const names = bought.map((i) => i.name.split(/\s+[—–-]\s+/)[0].trim());
    try {
      await savePantry(uniqItems([...pantry, ...names]));
      await saveShop(items.filter((i) => !i.checked));
      toast(`${names.length} item(ns) foram para a despensa!`);
    } catch (e) { toast("Erro ao mover itens.", "err"); }
  };
  const groups = useMemo(() => {
    const g = new Map();
    items.forEach((it, idx) => { const c = it.category || "Outros"; if (!g.has(c)) g.set(c, []); g.get(c).push({ ...it, idx }); });
    return [...g.entries()];
  }, [shopping]);
  const checkedCount = items.filter((i) => i.checked).length;

  // --- despensa ---
  const addIng = (e) => {
    e.preventDefault();
    const parts = newIng.split(/[,;\n]/).map((x) => x.trim()).filter(Boolean).map((x) => str(x, 60));
    if (!parts.length) return;
    setNewIng("");
    savePantry(uniqItems([...pantry, ...parts])).catch(() => toast("Erro ao salvar.", "err"));
  };
  const removeIng = (i) => savePantry(pantry.filter((_, j) => j !== i)).catch(() => toast("Erro ao salvar.", "err"));
  const clearPantry = async () => {
    if (!(await confirmAsk({ title: "Esvaziar despensa?", text: "Todos os ingredientes serão removidos.", ok: "Esvaziar", danger: true }))) return;
    savePantry([]).catch(() => toast("Erro ao salvar.", "err"));
  };

  // --- receitas (coleção própria "recipes") ---
  const genRecipes = async (mode) => {
    if (mode === "pantry" && !pantry.length) { setSection("despensa"); toast("Adicione ingredientes na despensa primeiro.", "err"); return; }
    if (mode === "plan" && !validPlan) { setErr('Crie um plano alimentar primeiro na aba "Plano".'); return; }
    setBusy(mode); setErr(null);
    try {
      const current = byKind(mode);
      const r = await ai("recipes", { mode, pantry, plan: validPlan ? { meals: plan.meals.map((m) => ({ name: m.name, options: planOptions(m, plan).map((o) => ({ text: o.text })) })) } : null, profile: profileForAI(profile), avoid: current.map((x) => x.name) });
      const list = (Array.isArray(r?.recipes) ? r.recipes : []).slice(0, 6).map(normalizeRecipe).filter((x) => x.ingredients.length && x.instructions.length);
      if (!list.length) throw new Error("A IA não retornou receitas. Tente novamente.");
      const at = new Date().toISOString();
      await Promise.all(list.map((rec, i) => addDoc(collection(db, "recipes"), clean({ ...rec, uid: user.uid, kind: mode, favorite: false, order: i, createdAt: at }))));
      await Promise.all(current.filter((x) => !x.favorite).map((x) => deleteDoc(doc(db, "recipes", x.id)).catch(() => {})));
      setSection("receitas");
      toast("Receitas novas salvas!");
    } catch (e) { setErr(e.message); } finally { setBusy(null); }
  };
  const toggleFav = (r) => updateDoc(doc(db, "recipes", r.id), { favorite: !r.favorite }).catch(() => toast("Erro ao salvar.", "err"));

  const RecipeBlock = ({ title, mode, icon, sub }) => {
    const list = byKind(mode).filter((r) => !r.favorite);
    const at = list[0]?.createdAt;
    return html`<div class="stack">
      <div class="between" style="flex-wrap:wrap">
        <div class="row"><div class=${"icon-box " + (mode === "pantry" ? "ib-or" : "ib-gr")}><${Icon} n=${icon} s=${20} /></div>
          <div><div class="h3">${title}</div><div class="tiny muted2 b">${at ? "Geradas em " + fmtDate(at, { day: "numeric", month: "short" }) : sub}</div></div></div>
        <button class=${"btn btn-sm " + (list.length ? "btn-soft" : "btn-dark")} disabled=${!!busy} onClick=${() => genRecipes(mode)}>
          ${busy === mode ? html`<${Spinner} s=${16} />Criando...` : html`<${Icon} n=${list.length ? "refresh" : "sparkles"} s=${16} />${list.length ? "Gerar outras" : "Gerar receitas"}`}</button>
      </div>
      ${busy === mode && !list.length ? html`<div class="cards-grid">${[1, 2].map(() => html`<div class="card tight stack"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:85%;height:18px"></div><div class="skeleton" style="width:70%"></div></div>`)}</div>`
        : list.length ? html`<div class="cards-grid">${list.map((r) => html`<${RecipeCard} key=${r.id} r=${r} fav=${!!r.favorite} onOpen=${() => setOpenId(r.id)} onFav=${() => toggleFav(r)} />`)}</div>`
        : html`<div class="card dashed tight small muted center" style="padding:20px">${mode === "pantry" ? (pantry.length ? `Toque em "Gerar receitas" para usar os ${pantry.length} itens da sua despensa.` : "Sua despensa está vazia. Adicione ingredientes primeiro.") : validPlan ? 'Toque em "Gerar receitas" para ideias que seguem seu plano.' : "Crie um plano alimentar para receber sugestões."}</div>`}
    </div>`;
  };

  return html`<div class="stack-lg anim">
    <div class="row" style="gap:12px"><div class="icon-box ib-dark" style="width:48px;height:48px"><${Icon} n="chef" s=${24} /></div>
      <div><div class="h1">Cozinha IA</div><div class="eyebrow or">Compras · Despensa · Receitas</div></div></div>

    <div class="seg" role="tablist">
      ${[["compras", "cart", "Compras"], ["despensa", "fridge", "Despensa"], ["receitas", "chef", "Receitas"]].map(([k, i, l]) => html`<button class=${section === k ? "on" : ""} onClick=${() => { setSection(k); setErr(null); }}><${Icon} n=${i} s=${16} />${l}</button>`)}
    </div>
    ${err && html`<div class="err"><${Icon} n="alert" s=${18} /><div class="grow">${err}</div><button class="link" onClick=${() => setErr(null)}>Ok</button></div>`}

    ${section === "compras" && html`<div class="card stack-lg">
      <div class="between" style="flex-wrap:wrap">
        <div><div class="h2">Lista de Compras da Semana</div><div class="small muted2">${shopping?.updatedAt ? `Atualizada em ${fmtDate(shopping.updatedAt, { day: "numeric", month: "short" })} · ${checkedCount}/${items.length} comprados` : "Baseada nas opções do seu plano alimentar."}</div></div>
        <button class="btn btn-dark btn-sm" disabled=${!!busy} onClick=${genShopping}>${busy === "shop" ? html`<${Spinner} s=${16} />Gerando...` : html`<${Icon} n="sparkles" s=${16} c="or" />${items.length ? "Gerar nova" : "Gerar pelo plano"}`}</button>
      </div>
      <form class="row" onSubmit=${addItem}><input class="input" value=${newItem} onInput=${(e) => setNewItem(e.target.value)} placeholder="Adicionar item à lista..." /><button class="btn btn-dark" style="padding:12px 14px" aria-label="Adicionar"><${Icon} n="plus" /></button></form>
      ${items.length === 0
        ? html`<${Empty} icon="cart" title="Sua lista está vazia." text=${validPlan ? "Gere pela IA a partir do seu plano ou adicione itens à mão." : "Crie um plano alimentar para gerar a lista automaticamente."} />`
        : html`<div class="stack-lg">${groups.map(([cat, list]) => html`<div class="stack" style="gap:8px" key=${cat}>
            ${groups.length > 1 && html`<div class="eyebrow">${cat}</div>`}
            <div class="cards-grid" style="gap:8px">${list.map((it) => html`<div class="row" style="gap:6px" key=${it.idx}>
              <button class=${"list-check grow " + (it.checked ? "on" : "")} onClick=${() => toggleItem(it.idx)}><span class="box"><${Icon} n="check" s=${14} w=${3} /></span><span class="txt">${it.name}</span></button>
              <button class="icon-btn" onClick=${() => removeItem(it.idx)} aria-label="Remover"><${Icon} n="x" s=${16} /></button></div>`)}</div>
          </div>`)}
          ${checkedCount > 0 && html`<button class="btn btn-gr btn-block" onClick=${moveCheckedToPantry}><${Icon} n="fridge" s=${18} />Mover ${checkedCount} comprado(s) para a despensa</button>`}
        </div>`}
    </div>`}

    ${section === "despensa" && html`<div class="card stack-lg">
      <div class="between"><div><div class="h2">Minha Despensa</div><div class="small muted2">O que você tem em casa. Separe vários itens por vírgula.</div></div>
        ${pantry.length > 0 && html`<button class="btn btn-ghost btn-sm" onClick=${clearPantry}><${Icon} n="trash" s=${15} />Esvaziar</button>`}</div>
      <form class="row" onSubmit=${addIng}><input class="input" value=${newIng} onInput=${(e) => setNewIng(e.target.value)} placeholder="Ex: frango, batata-doce, ovos..." /><button class="btn btn-dark" style="padding:12px 14px" aria-label="Adicionar"><${Icon} n="plus" /></button></form>
      ${pantry.length === 0 ? html`<${Empty} icon="fridge" title="Sua despensa está vazia." text="Adicione ingredientes ou marque itens comprados na lista de compras." />`
        : html`<div class="wrap-row">${pantry.map((p, i) => html`<span class="chip dark" key=${p + i}>${p}<button onClick=${() => removeIng(i)} aria-label=${"Remover " + p}><${Icon} n="x" s=${14} /></button></span>`)}</div>`}
      ${pantry.length > 0 && html`<button class="btn btn-or btn-lg btn-block" disabled=${!!busy} onClick=${() => genRecipes("pantry")}>${busy === "pantry" ? html`<${Spinner} />Pensando nas receitas...` : html`<${Icon} n="sparkles" />O que posso cozinhar?`}</button>`}
    </div>`}

    ${section === "receitas" && html`<div class="stack-lg">
      ${favorites.length > 0 && html`<div class="stack">
        <div class="row"><div class="icon-box" style="background:#fef2f2;color:#ef4444"><${Icon} n="heart" s=${20} /></div><div class="h3">Favoritas</div></div>
        <div class="cards-grid">${favorites.map((r) => html`<${RecipeCard} key=${"f" + r.id} r=${r} fav=${true} onOpen=${() => setOpenId(r.id)} onFav=${() => toggleFav(r)} />`)}</div>
      </div>`}
      <${RecipeBlock} title="Com o que tenho em casa" mode="pantry" icon="fridge" sub="Usa os itens da sua despensa" />
      <${RecipeBlock} title="Sugestões do meu plano" mode="plan" icon="sparkles" sub="Receitas que seguem sua dieta" />
    </div>`}

    ${open && html`<${RecipeModal} r=${open} user=${user} fav=${!!open.favorite} onFav=${() => toggleFav(open)} onClose=${() => setOpenId(null)} />`}
  </div>`;
}

// ---------------------------------------------------------------------
// App (estado global + assinaturas do Firestore)
// ---------------------------------------------------------------------
const TABS = [
  ["resumo", "pie", "Resumo"],
  ["analisar", "camera", "Analisar"],
  ["plano", "clipboard", "Plano"],
  ["cozinha", "chef", "Cozinha"],
  ["perfil", "user", "Perfil"],
];
const readHash = () => { const h = location.hash.replace("#", ""); return TABS.some((t) => t[0] === h) ? h : "resumo"; };

function useCollection(name, uid) {
  const [rows, setRows] = useState(null);
  useEffect(() => {
    if (!uid) { setRows(null); return; }
    return onSnapshot(query(collection(db, name), where("uid", "==", uid)),
      (snap) => setRows(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (e) => { console.error(name, e); setRows([]); });
  }, [uid, name]);
  return rows;
}
function useDocument(path, uid) {
  const [data, setData] = useState(undefined);
  useEffect(() => {
    if (!uid) { setData(undefined); return; }
    return onSnapshot(doc(db, path, uid),
      (snap) => setData(snap.exists() ? snap.data() : null),
      (e) => { console.error(path, e); setData(null); });
  }, [uid, path]);
  return data;
}

function ProfileTab({ user, profile, weights, go }) {
  return html`<div class="anim">
    <${WeightSection} user=${user} profile=${profile} weights=${weights} />
    <${RemindersCard} user=${user} profile=${profile} />
    <${ProfileForm} user=${user} profile=${profile} weights=${weights} onSaved=${() => go("resumo")} />
    <div style="height:20px"></div>
    <${AccountCard} user=${user} />
  </div>`;
}

function App() {
  const [user, setUser] = useState(undefined);
  const [tab, setTab] = useState(readHash());
  const [kitchenSection, setKitchenSection] = useState(store.get("kitchen", "compras"));
  const [mealOpen, setMealOpen] = useState(null);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [weightOpen, setWeightOpen] = useState(false);
  const [disclaimerClosed, setDisclaimerClosed] = useState(false);

  useEffect(() => onAuthStateChanged(auth, (u) => setUser(u || null)), []);
  useEffect(() => {
    const on = () => setTab(readHash());
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  useEffect(() => store.set("kitchen", kitchenSection), [kitchenSection]);

  const uid = user?.uid;
  const profile = useDocument("users", uid);
  const aiState = useDocument("aiState", uid);
  const mealsRaw = useCollection("meals", uid);
  const waterRaw = useCollection("waterLogs", uid);
  const plansRaw = useCollection("dietPlans", uid);
  const weightsRaw = useCollection("weightLogs", uid);
  const recipesRaw = useCollection("recipes", uid);
  const reportsRaw = useCollection("reports", uid);
  const shopping = useDocument("shoppingLists", uid);
  const pantryDoc = useDocument("pantry", uid);

  const meals = useMemo(() => (mealsRaw || []).filter((m) => m.timestamp).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)), [mealsRaw]);
  const water = waterRaw || [];
  const weights = useMemo(() => (weightsRaw || []).filter((w) => w.timestamp && num(w.weight) > 0).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)), [weightsRaw]);
  const recipes = recipesRaw || [];
  const reports = useMemo(() => (reportsRaw || []).slice().sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)), [reportsRaw]);
  const plan = useMemo(() => {
    const p = (plansRaw || []).filter((p) => Array.isArray(p.meals) && p.meals.length).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))[0];
    return p ? { ...p, dailyCalories: num(p.dailyCalories) || num(p.dailyCalorieTarget) || int(profile?.dailyCalorieGoal), macros: p.macros || {}, tips: Array.isArray(p.tips) ? p.tips : [] } : null;
  }, [plansRaw, profile?.dailyCalorieGoal]);

  // Migração única: receitas/favoritas que ficavam dentro do documento da despensa -> coleção "recipes"
  const migrated = useRef(false);
  useEffect(() => {
    if (!uid || migrated.current || !pantryDoc || recipesRaw === null) return;
    const old = pantryDoc.recipes || {};
    const legacy = [...(old.pantry || []).map((r) => ({ ...r, kind: "pantry" })), ...(old.plan || []).map((r) => ({ ...r, kind: "plan" }))];
    const favs = pantryDoc.favorites || [];
    if (!legacy.length && !favs.length) return;
    migrated.current = true;
    (async () => {
      try {
        const favNames = new Set(favs.map((f) => f.name));
        const all = [...legacy, ...favs.filter((f) => !legacy.some((l) => l.name === f.name)).map((f) => ({ ...f, kind: f.kind || "plan" }))];
        const at = new Date().toISOString();
        await Promise.all(all.map((r, i) => { const { id, ...rest } = r; return addDoc(collection(db, "recipes"), clean({ ...rest, uid, favorite: favNames.has(r.name), order: i, createdAt: at })); }));
        await setDoc(doc(db, "pantry", uid), { uid, ingredients: pantryDoc.ingredients || [], recipes: deleteField(), favorites: deleteField() }, { merge: true });
      } catch (e) { console.warn("Migração de receitas adiada:", e?.code || e); migrated.current = false; }
    })();
  }, [uid, pantryDoc, recipesRaw]);

  // Lembretes por notificação (enquanto o app estiver aberto ou em segundo plano)
  const live = useRef({});
  live.current = { profile, meals, water, plan, weights };
  useEffect(() => {
    if (!uid) return;
    const tick = () => {
      const st = live.current;
      if (!st.profile || !store.get("notify", false) || !("Notification" in window) || Notification.permission !== "granted") return;
      const shown = store.get("shown", {});
      for (const r of computeReminders(st)) {
        if (shown[r.id]) continue;
        shown[r.id] = Date.now();
        showNotification(r);
      }
      const cutoff = Date.now() - 3 * 864e5;
      store.set("shown", Object.fromEntries(Object.entries(shown).filter(([, t]) => t > cutoff)));
    };
    const first = setTimeout(tick, 15000);
    const id = setInterval(tick, 5 * 60000);
    return () => { clearTimeout(first); clearInterval(id); };
  }, [uid]);

  const liveMeal = mealOpen ? meals.find((m) => m.id === mealOpen.id) : null;

  const go = (t, sub) => {
    if (sub) setKitchenSection(sub);
    if (location.hash !== "#" + t) location.hash = t; else setTab(t);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const logout = async () => {
    if (await confirmAsk({ title: "Sair da conta?", text: "Seus dados continuam salvos na nuvem.", ok: "Sair" })) signOut(auth);
  };

  if (user === undefined || (user && profile === undefined)) return html`<div class="splash"><${Spinner} s=${36} c="or" /></div>`;
  if (!user) return html`<${AuthScreen} /><${Toasts} />`;
  if (!profile || !profile.weight) {
    return html`<div class="wrap" style="padding-bottom:40px">
      <div class="between" style="margin-bottom:20px"><div class="brand"><div class="logo"><${Icon} n="flame" s=${22} /></div><div><div class="brand-name">NutriTrack</div><div class="brand-sub">Quase lá!</div></div></div>
        <button class="btn btn-ghost btn-sm rd" onClick=${() => signOut(auth)}><${Icon} n="logout" s=${16} />Sair</button></div>
      <${ProfileForm} user=${user} profile=${profile} weights=${[]} onboarding />
    </div><${Toasts} /><${ConfirmHost} />`;
  }

  const loading = mealsRaw === null;

  return html`<div>
    <header class="top"><div class="top-in">
      <button class="brand" onClick=${() => go("resumo")} aria-label="Ir para o resumo"><div class="logo"><${Icon} n="flame" s=${22} /></div>
        <div style="text-align:left"><div class="brand-name">NutriTrack</div><div class="brand-sub">Inteligência Artificial</div></div></button>
      <div class="row" style="gap:4px">
        <button class="btn btn-ghost btn-sm md-flex" onClick=${() => go("perfil")}><${Icon} n="user" s=${16} />${firstName(profile.name || user.displayName)}</button>
        <button class="btn btn-ghost btn-sm" style="color:#ef4444" onClick=${logout}><${Icon} n="logout" s=${16} />Sair</button>
      </div>
    </div></header>

    <main class="wrap" key=${tab}>
      ${loading ? html`<div class="splash" style="min-height:50vh"><${Spinner} s=${32} c="or" /></div>`
        : tab === "resumo" ? html`<${Dashboard} user=${user} profile=${profile} aiState=${aiState} meals=${meals} water=${water} plan=${plan} weights=${weights} reports=${reports} go=${go} openMeal=${setMealOpen} openHistory=${() => setHistoryOpen(true)} openWeight=${() => setWeightOpen(true)} />`
        : tab === "analisar" ? html`<${Analyze} user=${user} profile=${profile} meals=${meals} go=${go} />`
        : tab === "plano" ? html`<${PlanView} user=${user} profile=${profile} plan=${plan} meals=${meals} go=${go} />`
        : tab === "cozinha" ? html`<${Kitchen} user=${user} profile=${profile} plan=${plan} shopping=${shopping} pantryDoc=${pantryDoc} recipes=${recipes} section=${kitchenSection} setSection=${setKitchenSection} />`
        : html`<${ProfileTab} user=${user} profile=${profile} weights=${weights} go=${go} />`}
      <div class="footer-note">NutriTrack v${APP_VERSION} · Estimativas de IA · Não substitui orientação de nutricionista ou médico</div>
    </main>

    <nav class="nav" aria-label="Navegação principal"><div class="nav-in">
      ${TABS.map(([k, i, l]) => html`<button class=${(tab === k ? "on " : "") + (k === "analisar" ? "cta" : "")} onClick=${() => go(k)} aria-current=${tab === k ? "page" : null}><span class="nb"><${Icon} n=${i} s=${20} /></span>${l}</button>`)}
    </div></nav>

    ${liveMeal && html`<${MealModal} key=${liveMeal.id} meal=${liveMeal} meals=${meals} user=${user} onClose=${() => setMealOpen(null)} />`}
    ${historyOpen && !liveMeal && html`<${HistoryModal} meals=${meals} onClose=${() => setHistoryOpen(false)} openMeal=${(m) => setMealOpen(m)} />`}
    ${weightOpen && html`<${WeightQuickModal} user=${user} profile=${profile} onClose=${() => setWeightOpen(false)} />`}
    ${!profile.disclaimerAck && !disclaimerClosed && html`<${DisclaimerModal} user=${user} onClose=${() => setDisclaimerClosed(true)} />`}
    <${Toasts} /><${ConfirmHost} />
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));

// App instalável + funcionamento offline (só quando servido pela web)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW:", e)));
}
</script>
</body>
</html>
